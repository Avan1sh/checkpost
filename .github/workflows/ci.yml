name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: Gateway tests and evaluation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit, integration and safety tests
        run: python -m pytest tests -q

      - name: Measured evaluation suite
        # Runs against the in-process Razorpay simulator with the advisory LLM
        # disabled, so the deterministic guarantees are verified without any keys.
        run: python -m scripts.run_evals

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-results-py${{ matrix.python-version }}
          path: docs/evaluation-results.md

  dashboard:
    name: Merchant dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard
